name: Build publication list

on:
  push:
    branches: [master]
    paths:
      - "_bibliography/publications.bib"
      - "scripts/build_publications.py"
      - "scripts/build_publications_pdf.py"
      - ".github/workflows/build_publications.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publication build dependencies
        run: pip install "bibtexparser==1.4.3" "reportlab==4.4.3"

      - name: Generate publication HTML
        run: python scripts/build_publications.py

      - name: Generate publication PDF
        run: python scripts/build_publications_pdf.py

      - name: Commit generated list when changed
        run: |
          if git diff --quiet -- _includes/publications-generated.html files/publications.pdf; then
            echo "Publication outputs are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _includes/publications-generated.html files/publications.pdf
          git commit -m "Update generated publication outputs"
          git push
