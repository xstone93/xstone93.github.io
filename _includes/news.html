{% assign news_items = site.data.news | sort: "date" | reverse %}
{% if news_items.size > 0 %}
<section class="homepage-news" aria-labelledby="homepage-news-title">
  <h2 id="homepage-news-title">News</h2>
  <ul class="homepage-news__list">
    {% for item in news_items limit: 5 %}
      <li class="homepage-news__item">
        <time datetime="{{ item.date }}" class="homepage-news__date">{{ item.date }}</time>
        <span class="homepage-news__text">
          {{ item.text }}{% if item.url %} <a href="{{ item.url | relative_url }}">Read more</a>{% endif %}
        </span>
      </li>
    {% endfor %}
  </ul>
</section>

<style>
.homepage-news { margin-top: 2rem; }
.homepage-news__list {
  margin: 0;
  padding: 0;
  list-style: none;
}
.homepage-news__item {
  display: grid;
  grid-template-columns: 7.2rem minmax(0, 1fr);
  gap: .7rem;
  padding: .5rem 0;
  border-bottom: 1px solid rgba(127, 127, 127, .22);
}
.homepage-news__date {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.homepage-news__text { min-width: 0; }

@media (max-width: 520px) {
  .homepage-news__item {
    grid-template-columns: 1fr;
    gap: .1rem;
  }
}
</style>
{% endif %}
